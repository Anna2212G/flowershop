<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог — FlowerShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <img src="images/logo.png" alt="Логотип" class="logo">
    <h1>FlowerShop</h1>
</header>

<nav>
    <a href="index.html">Главная</a>
    <a href="catalog.html">Каталог</a>
    <a href="price.html">Прайс-лист</a>
    <a href="about.html">О нас</a>
</nav>

<main>
    <h2>Каталог товаров</h2>

    <h3>Букеты</h3>
    <div class="grid">
        <div class="card">
            <img src="images/flower1.jpg" alt="Сердце из роз">
            <h4>Букет «Сердце из роз»</h4>
            <p class="price">3 500 руб.</p>
        </div>
        <div class="card">
            <img src="images/flower2.jpg" alt="Букет Весна">
            <h4>Букет «Весна»</h4>
            <p class="price">4 200 руб.</p>
        </div>
        <div class="card">
            <img src="images/flower3.jpg" alt="Букет Волна">
            <h4>Букет «Волна»</h4>
            <p class="price">5 000 руб.</p>
        </div>
    </div>

    <h3>Подарки и аксессуары</h3>
    <div class="grid">
        <div class="card">
            <img src="images/toy.jpg" alt="Игрушка">
            <h4>Мягкая игрушка</h4>
            <p class="price">1 200 руб.</p>
        </div>
        <div class="card">
            <img src="images/balloon.jpg" alt="Шары">
            <h4>Шары</h4>
            <p class="price">850 руб.</p>
        </div>
        <div class="card">
            <img src="images/card.jpg" alt="Открытка">
            <h4>Открытка</h4>
            <p class="price">250 руб.</p>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 FlowerShop</p>
</footer>
</body>
</html>
